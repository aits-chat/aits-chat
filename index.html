<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AITS — 智能交通系统在线工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { max-width: 800px; width: 100%; }
  h1 {
    font-size: 48px;
    font-weight: 300;
    letter-spacing: 8px;
    text-align: center;
    margin-bottom: 8px;
    color: #fff;
  }
  .sub {
    text-align: center;
    color: #8ab4c8;
    font-size: 16px;
    letter-spacing: 4px;
    margin-bottom: 60px;
  }
  .tools {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 24px;
  }
  .tool-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 32px 24px;
    text-decoration: none;
    color: #e0e0e0;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .tool-card:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .tool-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
  }
  .tool-desc {
    font-size: 13px;
    color: #96b8c8;
    line-height: 1.6;
  }
  .tool-card.coming-soon {
    opacity: 0.6;
    cursor: default;
  }
  .tool-card.coming-soon:hover {
    transform: none;
    box-shadow: none;
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.12);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    background: rgba(106, 200, 255, 0.2);
    color: #6ac8ff;
    padding: 4px 12px;
    border-radius: 20px;
    margin-top: 12px;
  }
  .footer {
    text-align: center;
    margin-top: 60px;
    font-size: 12px;
    color: #5a8090;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>AITS</h1>
  <p class="sub">济安交通 · 智能在线工具集</p>

  <div class="tools">
    <a class="tool-card" href="/flowmap/">
      <div class="icon">🔄</div>
      <div class="tool-name">FlowMap</div>
      <div class="tool-desc">交叉口转向流量图<br>Excel 导入，一键成图</div>
      <span class="badge">已上线</span>
    </a>

    <div class="tool-card coming-soon">
      <div class="icon">✚</div>
      <div class="tool-name">交叉口设计</div>
      <div class="tool-desc">平面交叉口在线设计<br>渠化、信号配时一体化</div>
      <span class="badge">即将推出</span>
    </div>

    <a class="tool-card" href="/cross-section/">
      <div class="icon">📐</div>
      <div class="tool-name">横断面设计</div>
      <div class="tool-desc">道路横断面在线设计<br>车道宽、分隔带、边坡</div>
      <span class="badge">已上线</span>
    </a>
  </div>

  <div class="footer">© 2026 济安交通 &nbsp;|&nbsp; AITS.chat</div>
</div>
</body>
</html>
