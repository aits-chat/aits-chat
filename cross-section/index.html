<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横断面设计 - AITS</title>
<link rel="stylesheet" href="css/style.css?v=3.1">
</head>
<body>

<!-- 顶部工具栏 -->
<div id="top-toolbar">
  <div class="tb-group">
    <button class="tb-btn" id="btn-new" title="新建断面">📄 新建</button>
    <button class="tb-btn" id="btn-open" title="打开JSON文件">📂 打开</button>
    <button class="tb-btn" id="btn-save" title="保存到JSON">💾 保存</button>
    <button class="tb-btn" id="btn-export-png" title="导出PNG图片">🖼️ 导出PNG</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <label class="tb-label">道路等级</label>
    <select id="sel-grade" class="tb-select">
      <option value="0">快速路 100km</option>
      <option value="1">快速路 80km</option>
      <option value="2" selected>主干路 60km</option>
      <option value="3">主干路 50km</option>
      <option value="4">主干路 40km</option>
      <option value="5">次干路 40km</option>
      <option value="6">次干路 30km</option>
      <option value="7">支路 20km</option>
    </select>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn accent" id="btn-generate">🔄 生成断面</button>
    <button class="tb-btn" id="btn-recalc">📐 重计算</button>
    <button class="tb-btn" id="btn-center">⊙ 居中</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <label class="tb-label">红线(m)</label>
    <input type="number" id="input-redline" class="tb-input" value="40" min="10" max="100" step="1">
  </div>
  <div class="tb-group">
    <label class="tb-label">风格</label>
    <select id="sel-style" class="tb-select" style="width:70px">
      <option value="0">实景</option>
      <option value="1" selected>剪影</option>
    </select>
  </div>
  <div class="tb-right">
    <span id="status-zoom" class="tb-status">100%</span>
    <span id="status-info" class="tb-status">横断面设计</span>
  </div>
</div>

<!-- 主区域 -->
<div id="main-area">
  <!-- 左侧道路信息面板 -->
  <div id="left-panel">
    <div class="panel-section">
      <h3>道路信息</h3>
      <div class="info-row"><span class="ilabel">总宽</span><span class="ivalue" id="info-total-width">--</span></div>
      <div class="info-row"><span class="ilabel">车道数</span><span class="ivalue" id="info-lane-count">--</span></div>
      <div class="info-row"><span class="ilabel">红线</span><span class="ivalue" id="info-redline">--</span></div>
    </div>
    <div class="panel-section">
      <h3>断面构成</h3>
      <div id="element-list"></div>
    </div>
  </div>

  <!-- 画布 -->
  <div id="canvas-container">
    <canvas id="main-canvas"></canvas>
    <div id="loading-overlay" style="display:none">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>

  <!-- 右侧属性面板 -->
  <div id="right-panel" style="display:none">
    <h3>元素属性</h3>
    <div id="prop-content"></div>
  </div>
</div>

<!-- 底部元素工具栏 -->
<div id="bottom-toolbar">
  <button class="elem-btn" data-type="Vehicle" title="机动车道">
    <span class="eicon">🚗</span><span>车道</span>
  </button>
  <button class="elem-btn" data-type="Bus" title="公交专用道">
    <span class="eicon">🚌</span><span>公交</span>
  </button>
  <button class="elem-btn" data-type="Truck" title="大车道">
    <span class="eicon">🚛</span><span>大车</span>
  </button>
  <button class="elem-btn" data-type="Tramcar" title="有轨电车">
    <span class="eicon">🚃</span><span>电车</span>
  </button>
  <span class="btb-sep"></span>
  <button class="elem-btn" data-type="Pedestrian" title="人行道">
    <span class="eicon">🚶</span><span>人行</span>
  </button>
  <button class="elem-btn" data-type="Bicycle" title="非机动车道">
    <span class="eicon">🚲</span><span>非机</span>
  </button>
  <span class="btb-sep"></span>
  <button class="elem-btn" data-type="IsoBelt" title="隔离带">
    <span class="eicon">🌿</span><span>隔离</span>
  </button>
  <button class="elem-btn" data-type="BusStop" title="公交站台">
    <span class="eicon">🚏</span><span>站台</span>
  </button>
  <span class="btb-sep"></span>
  <button class="elem-btn" data-type="UserDefine" data-ud="Overpass" title="高架">
    <span class="eicon">🌉</span><span>高架</span>
  </button>
  <button class="elem-btn" data-type="UserDefine" data-ud="Water" title="河流">
    <span class="eicon">🌊</span><span>河流</span>
  </button>
  <button class="elem-btn" data-type="UserDefine" data-ud="ParkLane" title="停车带">
    <span class="eicon">🅿️</span><span>停车</span>
  </button>
  <span class="btb-sep"></span>
  <button class="elem-btn danger" id="btn-delete" title="删除选中元素" disabled>
    <span class="eicon">🗑️</span><span>删除</span>
  </button>
</div>

<!-- 隐藏的文件输入 -->
<input type="file" id="file-open" accept=".json" style="display:none">

<script src="js/models.js?v=3.1"></script>
<script src="js/canvas-render.js?v=3.1"></script>
<script src="js/main.js?v=3.1"></script>
</body>
</html>
