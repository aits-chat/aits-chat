<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横断面设计 - AITS 智能交通在线工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== 顶部工具栏 ========== -->
<div id="toolbar">
    <span class="brand">🚦 横断面设计</span>
    <span class="toolbar-divider"></span>

    <label>道路等级</label>
    <select id="road-rank-select"></select>

    <label>速度</label>
    <input type="number" id="speed-input" value="50" min="20" max="120" step="10"> km/h

    <label>车道数</label>
    <select id="lane-count-select">
        <option value="2">2</option>
        <option value="4" selected>4</option>
        <option value="6">6</option>
        <option value="8">8</option>
    </select>

    <label>红线</label>
    <input type="number" id="redline-input" value="40" min="12" max="120" step="0.5"> m

    <button class="toolbar-btn primary" id="btn-generate">生成断面</button>

    <span class="toolbar-divider"></span>

    <span class="info-text">总宽: <span class="val" id="total-width-display">0.00</span> m</span>
    <span class="info-text">道路名称</span>
    <input type="text" id="road-name-input" value="" maxlength="16" placeholder="输入道路名称">

    <span class="toolbar-divider"></span>

    <button class="toolbar-btn" id="btn-center" title="居中显示">居中</button>
    <button class="toolbar-btn" id="btn-style" title="切换风格">风格</button>
    <button class="toolbar-btn" id="btn-toggle-dim" title="显示/隐藏标注">标注</button>
    <button class="toolbar-btn" id="btn-export-png">导出PNG</button>
    <button class="toolbar-btn" id="btn-save">保存</button>
    <button class="toolbar-btn" id="btn-load">打开</button>
    <button class="toolbar-btn danger" id="btn-delete" title="删除选中元素(Del)">删除</button>
</div>

<!-- ========== 主内容区 ========== -->
<div id="main-container">

    <!-- 左侧：添加元素面板 -->
    <div id="side-panel">
        <button class="add-btn" data-ele="car" title="标准车道">
            <span class="icon">🚗</span><span class="label">车道</span>
        </button>
        <button class="add-btn" data-ele="bus" title="公交车道">
            <span class="icon">🚌</span><span class="label">公交</span>
        </button>
        <button class="add-btn" data-ele="truck" title="大车道">
            <span class="icon">🚛</span><span class="label">大车</span>
        </button>
        <button class="add-btn" data-ele="tramcar" title="有轨电车">
            <span class="icon">🚋</span><span class="label">电车</span>
        </button>
        <button class="add-btn" data-ele="pedestrian" title="人行道">
            <span class="icon">🚶</span><span class="label">人行</span>
        </button>
        <button class="add-btn" data-ele="bicycle" title="非机动车道">
            <span class="icon">🚲</span><span class="label">非机</span>
        </button>
        <button class="add-btn" data-ele="busstop" title="公交站">
            <span class="icon">🚏</span><span class="label">站台</span>
        </button>
        <button class="add-btn" data-ele="isobelt" title="隔离带">
            <span class="icon">🌿</span><span class="label">隔离</span>
        </button>
        <button class="add-btn" data-ele="overpass" title="高架">
            <span class="icon">🌉</span><span class="label">高架</span>
        </button>
        <button class="add-btn" data-ele="water" title="河水">
            <span class="icon">💧</span><span class="label">河流</span>
        </button>
        <button class="add-btn" data-ele="park" title="停车带">
            <span class="icon">🅿️</span><span class="label">停车</span>
        </button>
    </div>

    <!-- 中间：Canvas画布 -->
    <div id="canvas-wrapper">
        <canvas id="main-canvas"></canvas>
    </div>

    <!-- 右侧：属性面板 -->
    <div id="prop-panel">
        <h3>元素属性</h3>
        <div id="prop-content">
            <div class="no-selection">点击选中断面元素</div>
        </div>
    </div>

</div>

<!-- ========== 状态栏 ========== -->
<div id="statusbar">
    <span>缩放: <span id="zoom-display">100</span>%</span>
    <span>坐标: <span class="coord" id="coord-display">-</span></span>
    <span>按 <span class="key-hint">滚轮</span> 缩放 · <span class="key-hint">拖拽</span> 平移 · <span class="key-hint">Del</span> 删除</span>
    <span style="margin-left:auto">AITS 智能交通工具集 v2.1</span>
</div>

<!-- ========== 隐藏的文件输入 ========== -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script src="js/models.js"></script>
<script src="js/canvas-render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
