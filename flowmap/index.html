<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','微软雅黑',sans-serif;background:#2b2b2b;color:#aaa;overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100vh}

/* 顶部工具栏 */
#toolbar{display:flex;align-items:center;padding:4px 12px;background:#1f1f1f;border-bottom:1px solid #333;gap:4px;flex-shrink:0}
#toolbar button{background:transparent;border:none;color:#aaa;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit;border-radius:2px}
#toolbar button:hover{background:#2b2b2b;color:#fff}

/* Popup Menu */
#fileMenu{display:none;position:absolute;top:36px;left:12px;background:#2b2b2b;border:1px solid #444;z-index:100;min-width:100px}
#fileMenu.show{display:block}
#fileMenu div{padding:10px 20px;font-size:14px;cursor:pointer;color:#aaa}
#fileMenu div:hover{background:#204544;color:#fff}

/* 主区域 */
#main{display:flex;flex:1;overflow:hidden}
#canvasWrap{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;padding:15px;position:relative}
#flowCanvas{border:1px solid #444}

/* 右侧输入面板 */
#sidePanel{width:435px;background:#1f1f1f;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
#sidePanel .panel-top{padding:15px 15px 0;display:flex;gap:0;align-items:flex-start}
#sidePanel .panel-top button{flex:1;background:#1f1f1f;border:none;color:#aaa;padding:10px;font-size:14px;cursor:pointer;font-family:inherit}
#sidePanel .panel-top button:hover{background:#2b2b2b;color:#fff}
#flowForm{padding:15px}
#flowForm table{width:100%;border-collapse:collapse;table-layout:fixed}
#flowForm thead th{color:#aaa;font-size:13px;padding:5px 2px;text-align:center;font-weight:normal;border-bottom:1px solid #333}
#flowForm thead th.subhead{font-size:11px;color:#888;border-bottom:none;padding:3px 2px}
#flowForm td{padding:2px;text-align:center}
#flowForm input[type=text],#flowForm input[type=number]{width:100%;background:#1f1f1f;border:1px solid #1f1f1f;color:#fff;font-size:14px;padding:6px 4px;text-align:center;font-family:inherit;border-radius:2px}
#flowForm input[type=text]:focus,#flowForm input[type=number]:focus{outline:none;border-color:#448DCA}
#flowForm input.readonly{color:#777;border:none}
#flowForm input:disabled{color:#555}
#flowForm .btn-row{display:flex;justify-content:flex-end;gap:4px;margin-top:8px}
#flowForm .btn-row button{background:#1f1f1f;border:none;color:#aaa;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit;border-radius:2px;width:85px}
#flowForm .btn-row button:hover{background:#2b2b2b;color:#fff}
#flowForm .id-cell{color:#fff;font-size:14px}

/* 图形设置面板 */
#graphPanel{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#2b2b2b;border:1px solid #555;z-index:200;padding:20px;min-width:420px;color:#aaa}
#graphPanel.show{display:block}
#graphPanel h3{margin-bottom:15px;color:#fff;font-size:16px}
#graphPanel .row{display:flex;align-items:center;margin-bottom:10px;gap:10px}
#graphPanel .row label{width:80px;text-align:right;font-size:14px}
#graphPanel .row select,#graphPanel .row input{background:#1f1f1f;border:1px solid #333;color:#fff;padding:4px 8px;font-size:14px;font-family:inherit}
#graphPanel .color-swatch{width:30px;height:20px;border:1px solid #555;cursor:pointer}
#graphPanel .btn-row{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
#graphPanel .btn-row button{background:#1f1f1f;border:1px solid #333;color:#aaa;padding:6px 20px;font-size:14px;cursor:pointer;font-family:inherit;border-radius:2px}
#graphPanel .btn-row button:hover{background:#333;color:#fff}

/* 遮罩 */
#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:150}
#overlay.show{display:block}

/* 提示信息 */
#infoPanel{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#2b2b2b;border:1px solid #555;z-index:200;padding:20px;min-width:350px;color:#aaa}
#infoPanel.show{display:block}
#infoPanel h3{margin-bottom:15px;color:#fff;font-size:16px}
#infoPanel p{margin-bottom:8px;font-size:14px}
#infoPanel .btn-row{display:flex;justify-content:flex-end;margin-top:15px}
#infoPanel .btn-row button{background:#1f1f1f;border:1px solid #333;color:#aaa;padding:6px 20px;font-size:14px;cursor:pointer;font-family:inherit;border-radius:2px}
#infoPanel .btn-row button:hover{background:#333;color:#fff}
</style>

<script>
// ==================== 数据模型 ====================
class FlowInfo {
  constructor(flowValue, startId, endId, turnShow) {
    this.flowValue = flowValue || 0;
    this.startId = startId || '';
    this.endId = endId || '';
    this.turnShow = turnShow || 0; // 0=掉头 1=左转 2=直行 3=右转
  }
}
class Flows {
  constructor() { this.flowList = []; }
}
class RoadInfo {
  constructor(roadId, roadName, roadDir) {
    this.roadId = roadId || '';
    this.roadName = roadName || '';
    this.roadDir = roadDir || 0;
    this.flowsList = [new Flows()];
  }
}
// 全局显示设置
const DisplaySettings = {
  fontsize: 14,
  fontfamily: '微软雅黑',
  fontcolor: '#808080',
  flag: true,        // 是否显示流量表
  scale: 0.15,
  roadColors: ['#f2592d','#0068a5','#ffc500','#118b0f'],
  backgroundColor: '#2b2b2b',
  flowRatio: 1,
  zoomRatio: 1,
  moveX: 0,
  moveY: 0
};

// ==================== 计算引擎 (翻译自Calculate.cs) ====================
const Calc = {
  // 求两直线交点
  getCrossPoint(p1, p2, p3, p4) {
    const cp = {x:0, y:0};
    if (p1.x === p2.x) {
      cp.x = p1.x;
      cp.y = cp.x * (p4.y - p3.y) / (p4.x - p3.x) + (p4.x * p3.y - p3.x * p4.y) / (p4.x - p3.x);
    } else if (p3.x === p4.x) {
      cp.x = p3.x;
      cp.y = cp.x * (p2.y - p1.y) / (p2.x - p1.x) + (p2.x * p1.y - p1.x * p2.y) / (p2.x - p1.x);
    } else {
      const a1 = (p2.y - p1.y) / (p2.x - p1.x);
      const b1 = p1.y - a1 * p1.x;
      const a2 = (p4.y - p3.y) / (p4.x - p3.x);
      const b2 = p3.y - a2 * p3.x;
      cp.x = (b2 - b1) / (a1 - a2);
      cp.y = (a1 * b2 - a2 * b1) / (a1 - a2);
    }
    return cp;
  },

  // 获取路段长度
  getLinkLength(midWidth, midHeight, roadDir) {
    const rad = Math.PI * roadDir / 180;
    if (Math.abs(Math.tan(rad)) * midWidth * 0.675 <= midHeight * 0.675) {
      return midWidth * 0.675 / Math.abs(Math.cos(rad));
    } else {
      return midHeight * 0.675 / Math.abs(Math.sin(rad));
    }
  },

  // 获取直行终点ID
  getStraightPointID(pointID, roadList) {
    let straPointID = -1;
    let minDiff = 180;
    if (roadList.length === 4) {
      for (let i = 0; i < roadList.length; i++) {
        const diff = Math.abs(Math.abs(roadList[i].roadDir - roadList[pointID].roadDir) - 180);
        if (diff < minDiff && Math.abs(pointID - i) === 2) {
          minDiff = diff;
          straPointID = i;
        }
      }
    }
    return straPointID;
  },

  // 获取转向点直行夹角
  getLinkTurnDir(pList1, pList2, roadList) {
    const dirList = [];
    for (let i = 0; i < roadList.length; i++) {
      const straID = this.getStraightPointID(i, roadList);
      if (straID === -1) {
        if (roadList[i].roadDir < 180) dirList.push(roadList[i].roadDir);
        else dirList.push(roadList[i].roadDir - 180);
      } else {
        for (let j = 0; j < roadList.length; j++) {
          if (j === straID) {
            if (pList2[j].x !== pList1[i].x) {
              const tanD = (pList2[j].y - pList1[i].y) / (pList2[j].x - pList1[i].x);
              let dir = -Math.round(Math.atan(tanD) * 180 / Math.PI);
              if (dir < 0) dir += 180;
              dirList.push(dir);
            } else {
              dirList.push(90);
            }
          }
        }
      }
    }
    return dirList;
  },

  // 获取路段起始中心夹角
  getLinkCenterDir(roadList) {
    return roadList.map(r => r.roadDir >= 180 ? r.roadDir - 180 : r.roadDir);
  },

  // 获取转向中心点
  getLinkTurnCenterPoint(iW, iH, roadList) {
    const mw = iW / 2;
    const mh = iH / 2;
    const oldPoints = roadList.map(r => {
      const len = this.getLinkLength(mw, mh, r.roadDir);
      const rad = Math.PI * r.roadDir / 180;
      return { x: mw + Math.cos(rad) * len / 2, y: mh - Math.sin(rad) * len / 2 };
    });
    return oldPoints;
  },

  // 获取路段起始中心点
  getLinkCenterPoint(iW, iH, roadList) {
    const turnPoints = this.getLinkTurnCenterPoint(iW, iH, roadList);
    const dirList = this.getLinkCenterDir(roadList);
    const mw = iW / 2;
    const mh = iH / 2;
    return roadList.map((r, i) => {
      let d = dirList[i];
      if (Math.abs(r.roadDir - d) > 90) d += 180;
      const len = this.getLinkLength(mw, mh, d);
      const rad = Math.PI * d / 180;
      return { x: turnPoints[i].x + Math.cos(rad) * len / 2, y: turnPoints[i].y - Math.sin(rad) * len / 2 };
    });
  },

  // 获取路段流量（进口/出口）
  getLinkFlow(roadList, type, roadID) {
    let sum = 0;
    for (const ri of roadList) {
      for (const flow of ri.flowsList[0].flowList) {
        if (type === 'in' && flow.startId === roadID) sum += flow.flowValue;
        if (type === 'out' && flow.endId === roadID) sum += flow.flowValue;
      }
    }
    return sum;
  },

  // 获取任意偏移点
  getShiftPoint(pointList, roadList, type, delta) {
    const inPts = [], outPts = [];
    const dirList = this.getLinkCenterDir(roadList);
    for (let i = 0; i < roadList.length; i++) {
      const dir = dirList[i] * Math.PI / 180;
      const sinD = Math.sin(dir), cosD = Math.cos(dir);
      if (Math.abs(roadList[i].roadDir - dirList[i]) < 90) {
        inPts.push({ x: pointList[i].x - delta * sinD, y: pointList[i].y - delta * cosD });
        outPts.push({ x: pointList[i].x + delta * sinD, y: pointList[i].y + delta * cosD });
      } else {
        inPts.push({ x: pointList[i].x + delta * sinD, y: pointList[i].y + delta * cosD });
        outPts.push({ x: pointList[i].x - delta * sinD, y: pointList[i].y - delta * cosD });
      }
    }
    return type === 'in' ? inPts : outPts;
  },

  // 获取进出口偏移量列表
  getDeltaList(roadList, iW, iH, maxFlow, type) {
    const thickness = this.getLinkThickness(roadList, maxFlow);
    const inHalf = [], outHalf = [];
    for (const ri of roadList) {
      inHalf.push(this.getLinkFlow(roadList, 'in', ri.roadId) * thickness / 2);
      outHalf.push(this.getLinkFlow(roadList, 'out', ri.roadId) * thickness / 2);
    }
    const minDelta = iW * 15 / 500;
    const inD = [], outD = [];
    for (let j = 0; j < roadList.length; j++) {
      const straID = this.getStraightPointID(j, roadList);
      if (straID !== -1) {
        inD.push(Math.max(inHalf[j], outHalf[straID]) + minDelta);
        outD.push(Math.max(outHalf[j], inHalf[straID]) + minDelta);
      } else {
        inD.push(inHalf[j] + minDelta);
        outD.push(outHalf[j] + minDelta);
      }
    }
    return type === 'in' ? inD : outD;
  },

  // 获取偏移后的路段中心点
  getLinkCenterShiftPoint(pointList, roadList, type, maxFlow, iW, iH) {
    const deltaList = this.getDeltaList(roadList, iW, iH, maxFlow, type);
    const dirList = this.getLinkCenterDir(roadList);
    const inPts = [], outPts = [];
    for (let i = 0; i < roadList.length; i++) {
      const dir = dirList[i] * Math.PI / 180;
      const delta = deltaList[i];
      const sinD = Math.sin(dir), cosD = Math.cos(dir);
      if (Math.abs(roadList[i].roadDir - dirList[i]) < 90) {
        inPts.push({ x: pointList[i].x - delta * sinD, y: pointList[i].y - delta * cosD });
        outPts.push({ x: pointList[i].x + delta * sinD, y: pointList[i].y + delta * cosD });
      } else {
        inPts.push({ x: pointList[i].x + delta * sinD, y: pointList[i].y + delta * cosD });
        outPts.push({ x: pointList[i].x - delta * sinD, y: pointList[i].y - delta * cosD });
      }
    }
    return type === 'in' ? inPts : outPts;
  },

  // 线段上按比例取点
  getPoint(p1, p2, ratio) {
    if (p1.x === p2.x) {
      const deltaY = Math.abs(p1.y - p2.y) * ratio;
      return { x: p1.x, y: p1.y + deltaY < p2.y ? p1.y + deltaY : p1.y - deltaY };
    }
    if (p1.y === p2.y) {
      const deltaX = Math.abs(p1.x - p2.x) * ratio;
      return { x: p1.x + deltaX < p2.x ? p1.x + deltaX : p1.x - deltaX, y: p1.y };
    }
    return { x: ratio * p2.x + (1 - ratio) * p1.x, y: ratio * p2.y + (1 - ratio) * p1.y };
  },

  // 获取流量宽度比例
  getLinkThickness(roadList, maxFlow) {
    let max = maxFlow;
    for (const ri of roadList) {
      for (const flow of ri.flowsList[0].flowList) {
        if (flow.flowValue > max) max = flow.flowValue;
      }
    }
    return 50 * DisplaySettings.flowRatio / max;
  },

  // 根据流量获取转向点偏移
  getLinkTurnPointByFlow(pointList, roadList, type, startID, endID, turnShow, thickness) {
    let sumFlow, delta = 0;
    let inId = parseInt(startID), outId = parseInt(endID);
    if (type === 'in') {
      sumFlow = this.getLinkFlow(roadList, 'in', startID);
    } else {
      sumFlow = this.getLinkFlow(roadList, 'out', endID);
    }
    for (const ri of roadList) {
      if (type === 'in') {
        if (ri.roadId === startID) {
          for (const fi of ri.flowsList[0].flowList) {
            if (fi.turnShow < turnShow) delta += fi.flowValue;
            if (fi.turnShow === turnShow) delta += fi.flowValue / 2;
          }
        }
      } else {
        for (const fi of ri.flowsList[0].flowList) {
          if (fi.endId === endID && fi.turnShow <= turnShow) {
            if (fi.startId === startID) delta += fi.flowValue / 2;
            else delta += fi.flowValue;
          }
        }
      }
    }
    let ri;
    for (const r of roadList) {
      if (r.roadId === startID) inId = roadList.indexOf(r);
      if (r.roadId === endID) outId = roadList.indexOf(r);
    }
    if (type === 'in') {
      ri = roadList[inId];
      return this.getShiftPoint(pointList, [ri], type, (delta - sumFlow / 2) * thickness)[0];
    } else {
      ri = roadList[outId];
      return this.getShiftPoint(pointList, [ri], type, (delta - sumFlow / 2) * thickness)[0];
    }
  }
};

// ==================== 绘图引擎 (翻译自Draw.cs) ====================
const Drawer = {
  // 画三角形箭头
  drawTriangle(ctx, p1, p2, width, height, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    let pts;
    if (p1.x === p2.x) {
      pts = [{x:p2.x + width/2, y:p2.y},{x:p2.x - width/2, y:p2.y}];
      pts.push({x:p2.x, y: p2.y - height < p1.y ? p2.y - height : p2.y + height});
    } else if (p1.y === p2.y) {
      pts = [{x:p2.x, y:p2.y - width/2},{x:p2.x, y:p2.y + width/2}];
      pts.push({x: p2.x + height > p1.x ? p2.x + height : p2.x - height, y:p2.y});
    } else {
      const ratio = (p2.y - p1.y) / (p2.x - p1.x);
      const denom = 2 * Math.sqrt(1 + ratio * ratio);
      pts = [
        {x:p2.x + width * ratio / denom, y:p2.y - width / denom},
        {x:p2.x - width * ratio / denom, y:p2.y + width / denom}
      ];
      const hx = p2.x + height / Math.sqrt(1 + ratio * ratio);
      pts.push({x: hx > p1.x ? hx : p2.x - height / Math.sqrt(1 + ratio * ratio),
                y: hx > p1.x ? p2.y + ratio * height / Math.sqrt(1 + ratio * ratio) :
                               p2.y - ratio * height / Math.sqrt(1 + ratio * ratio)});
    }
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  },

  // 画转向路径
  drawTurn(ctx, sp, stp, etp, ep, stcp, etcp, rd1, rd2, color, thickness, iW, iH) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, thickness);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);

    let sTP = {...stp}, eTP = {...etp};
    const centerPt = { x: (stp.x + etp.x) / 2, y: (stp.y + etp.y) / 2 };

    if (stcp.x === etcp.x && stcp.y === etcp.y) {
      // 掉头
      sTP = Calc.getPoint(stp, sp, 0.3);
      eTP = Calc.getPoint(etp, ep, 0.5);
      ctx.lineTo(sTP.x, sTP.y);
      ctx.quadraticCurveTo(centerPt.x, centerPt.y, eTP.x, eTP.y);
    } else if (Math.abs(rd1 - rd2) === 180) {
      // 直行
      ctx.lineTo(sTP.x, sTP.y);
      ctx.quadraticCurveTo(centerPt.x, centerPt.y, eTP.x, eTP.y);
    } else {
      // 左转/右转
      if (Math.abs(rd1 - rd2) <= 90 || Math.abs(rd1 - rd2) >= 270) {
        const tarLen = 0.25 * Calc.getLinkLength(iW / 2, iH / 2, rd2);
        if (Math.abs(stp.y - etp.y) < tarLen) {
          if (rd1 >= 180 && rd1 <= 270 && (rd2 - rd1) > 0) {
            eTP = Calc.getPoint(etp, ep, 0.5);
          } else {
            eTP = Calc.getPoint(etp, ep, 0.5);
            sTP = Calc.getPoint(stp, sp, 0.3);
          }
        } else {
          if (Math.abs(stp.x - etp.x) < tarLen) {
            if (rd1 >= 180 && rd1 <= 270 && (rd2 - rd1) > 0) {
              sTP = Calc.getPoint(stp, sp, 0.5);
            } else {
              eTP = Calc.getPoint(etp, ep, 0.5);
              sTP = Calc.getPoint(stp, sp, 0.3);
            }
          }
        }
      }
      ctx.lineTo(sTP.x, sTP.y);
      const cp = Calc.getCrossPoint(sp, sTP, eTP, ep);
      ctx.quadraticCurveTo(cp.x, cp.y, eTP.x, eTP.y);
    }
    ctx.lineTo(ep.x, ep.y);
    ctx.stroke();
    ctx.restore();
  },

  // 画路段名称文字
  drawText(ctx, iW, iH, roadList, delta) {
    const pts = Calc.getLinkCenterPoint(iW, iH, roadList);
    const dirs = Calc.getLinkCenterDir(roadList);
    for (let i = 0; i < roadList.length; i++) {
      const name = roadList[i].roadName;
      ctx.save();
      ctx.font = `${DisplaySettings.fontsize}px "${DisplaySettings.fontfamily}"`;
      const metrics = ctx.measureText(name);
      const tw = metrics.width + 8;

      // 计算偏移后的位置（偏移delta像素）
      const d = dirs[i];
      let dir = d * Math.PI / 180;
      let cx, cy;
      if (Math.abs(roadList[i].roadDir - d) < 90) {
        cx = pts[i].x + delta * Math.cos(dir);
        cy = pts[i].y - delta * Math.sin(dir);
      } else {
        cx = pts[i].x - delta * Math.cos(dir);
        cy = pts[i].y + delta * Math.sin(dir);
      }

      // 旋转并绘制
      const angle = (270 - roadList[i].roadDir) * Math.PI / 180;
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = DisplaySettings.fontcolor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(name, 0, 0);
      ctx.restore();
    }
  },

  // 画路段转向
  drawLinkTurn(ctx, roadList, iW, iH, maxFlow) {
    const thickness = Calc.getLinkThickness(roadList, maxFlow);
    const colors = DisplaySettings.roadColors;

    const centerPts = Calc.getLinkCenterPoint(iW, iH, roadList);
    const turnPts = Calc.getLinkTurnCenterPoint(iW, iH, roadList);

    const inCenterPts = Calc.getLinkCenterShiftPoint(centerPts, roadList, 'in', maxFlow, iW, iH);
    const inTurnPts = Calc.getLinkCenterShiftPoint(turnPts, roadList, 'in', maxFlow, iW, iH);
    const outCenterPts = Calc.getLinkCenterShiftPoint(centerPts, roadList, 'out', maxFlow, iW, iH);
    const outTurnPts = Calc.getLinkCenterShiftPoint(turnPts, roadList, 'out', maxFlow, iW, iH);

    for (let i = 0; i < roadList.length; i++) {
      const straID = Calc.getStraightPointID(i, roadList);
      for (let j = 0; j < roadList.length; j++) {
        const outFlowVal = Calc.getLinkFlow(roadList, 'out', roadList[j].roadId);
        for (const flow of roadList[i].flowsList[0].flowList) {
          if (flow.startId === roadList[i].roadId && flow.endId === roadList[j].roadId) {
            const p1 = Calc.getLinkTurnPointByFlow([inCenterPts[i]], roadList, 'in', flow.startId, flow.endId, flow.turnShow, thickness);
            const p2 = Calc.getLinkTurnPointByFlow([inTurnPts[i]], roadList, 'in', flow.startId, flow.endId, flow.turnShow, thickness);
            const p3 = Calc.getLinkTurnPointByFlow([outCenterPts[j]], roadList, 'out', flow.startId, flow.endId, flow.turnShow, thickness);
            const p4 = Calc.getLinkTurnPointByFlow([outTurnPts[j]], roadList, 'out', flow.startId, flow.endId, flow.turnShow, thickness);
            const p5 = Calc.getPoint(p3, p4, 0.4);

            // 画转向曲线
            this.drawTurn(ctx, p1, p2, p4, p5, turnPts[i], turnPts[j],
              roadList[i].roadDir, roadList[j].roadDir, colors[i],
              Math.ceil(flow.flowValue * thickness), iW, iH);

            // 画箭头
            if (j === straID) {
              const aw = 1.75 * outFlowVal * thickness;
              const dist = Math.sqrt(Math.pow(outCenterPts[j].y - outTurnPts[j].y, 2) + Math.pow(outCenterPts[j].x - outTurnPts[j].x, 2));
              const ah = 0.4 * dist;
              const arrowP = Calc.getPoint(outCenterPts[j], outTurnPts[j], 0.4);
              this.drawTriangle(ctx, outTurnPts[j], arrowP, aw, ah, colors[i]);
            }
            if (straID === -1 && j === i) {
              const toutFlow = Calc.getLinkFlow(roadList, 'out', roadList[i].roadId);
              const aw = 1.75 * toutFlow * thickness;
              const dist = Math.sqrt(Math.pow(outCenterPts[j].y - outTurnPts[j].y, 2) + Math.pow(outCenterPts[j].x - outTurnPts[j].x, 2));
              const ah = 0.4 * dist;
              const arrowP = Calc.getPoint(outCenterPts[i], outTurnPts[i], 0.4);
              this.drawTriangle(ctx, outTurnPts[j], arrowP, aw, ah, colors[i]);
            }
          }
        }
      }
    }
  },

  // 画流量表
  // 表格放在每条路的远端外侧（无箭头的一端），不压流线和路名
  getTablePosition(roadDir, iW, iH, gridW, gridH, scale) {
    const mw = iW / 2, mh = iH / 2;
    let dir = ((roadDir % 360) + 360) % 360;
    const rad = dir * Math.PI / 180;

    /* ---- 第一步：道路远端端点 ---- */
    const roadLen = Calc.getLinkLength(mw, mh, roadDir);
    const farX = mw + Math.cos(rad) * roadLen;
    const farY = mh - Math.sin(rad) * roadLen;

    /* ---- 第二步：从远端沿道路方向再往外推 ---- */
    const pushDist = Math.max(gridW * 0.5, iW * scale * 0.10);
    const tipX = farX + Math.cos(rad) * pushDist;
    const tipY = farY - Math.sin(rad) * pushDist;

    /* ---- 第三步：垂直偏移（+90° 逆时针），推向对应外角落 ---- */
    //   东0°→右上  西180°→左下  北90°→左上  南270°→右下
    const perpRad = (roadDir + 90) * Math.PI / 180;
    // 南北路垂直偏移略小，贴紧道路绕行线
    const isNS = (dir > 45 && dir < 135) || (dir > 225 && dir < 315);
    const perpDist = gridW * (isNS ? 0.33 : 0.40);

    let ax = tipX + Math.cos(perpRad) * perpDist - gridW / 2;
    let ay = tipY - Math.sin(perpRad) * perpDist - gridH / 2;

    /* ---- 第四步：边界钳制，防溢出画布 ---- */
    const m = 12;
    ax = Math.max(m, Math.min(iW - gridW - m, ax));
    ay = Math.max(m, Math.min(iH - gridH - m, ay));

    return { x: ax, y: ay };
  },

  drawFlowTable(ctx, roadList, iW, iH, scale, delta, maxFlow) {
    const turnColors = {0:'#f2592d', 1:'#0068a5', 2:'#44cc44', 3:'#ffaa00'};
    const turnLabels = {0:'掉', 1:'左', 2:'直', 3:'右'};

    for (let i = 0; i < roadList.length; i++) {
      const oldFlows = roadList[i].flowsList[0].flowList;
      const newFlows = oldFlows.filter(f => f.flowValue !== 0);
      const colNum = newFlows.length;
      if (colNum === 0) continue;

      // 表格尺寸
      const fontSize = this.getFontSize(iW);
      const colW = Math.max(22, fontSize * 2.8);
      const headerH = fontSize * 1.6;
      const valueH = fontSize * 1.4;
      const gridW = colNum * colW;
      const gridH = headerH + valueH;

      // 根据路段实际几何计算安全位置
      const anchor = this.getTablePosition(roadList[i].roadDir, iW, iH, gridW, gridH, scale);
      const gridX = anchor.x;
      const gridY = anchor.y;

      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(gridX, gridY, gridW, gridH);
      ctx.strokeStyle = '#888888';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(gridX, gridY, gridW, gridH);

      // 分割线
      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(gridX, gridY + headerH);
      ctx.lineTo(gridX + gridW, gridY + headerH);
      for (let s = 1; s < colNum; s++) {
        const sx = gridX + s * colW;
        ctx.moveTo(sx, gridY); ctx.lineTo(sx, gridY + gridH);
      }
      ctx.stroke();

      // 填充转向中文 + 流量值
      for (let k = 0; k < colNum; k++) {
        const cx = gridX + (k + 0.5) * colW;
        const turnVal = parseInt(newFlows[k].turnShow);

        ctx.fillStyle = turnColors[turnVal] || '#888';
        ctx.font = `bold ${fontSize * 0.85}px "${DisplaySettings.fontfamily}"`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(turnLabels[turnVal] || '?', cx, gridY + headerH / 2);

        const txt = newFlows[k].flowValue.toString();
        ctx.fillStyle = '#000000';
        ctx.font = `${fontSize * 0.8}px "${DisplaySettings.fontfamily}"`;
        ctx.fillText(txt, cx, gridY + headerH + valueH / 2);
      }
      ctx.restore();
    }
  },

  getFontSize(iW) {
    return Math.max(11, 1 * (DisplaySettings.scale * iW / 10));
  },

  // 主渲染函数
  renderAll(ctx, iW, iH, roadList) {
    const maxFlow = 8000;

    // 绘制转向flows
    this.drawLinkTurn(ctx, roadList, iW, iH, maxFlow);
    // 绘制路段名
    this.drawText(ctx, iW, iH, roadList, 15);
    // 绘制流量表
    if (DisplaySettings.flag) {
      this.drawFlowTable(ctx, roadList, iW, iH, DisplaySettings.scale, 10, maxFlow);
    }
  }
};

// ==================== 应用控制器 ====================
const App = {
  roadList: [],
  canvas: null,
  ctx: null,
  canvasSize: 500,

  init() {
    this.canvas = document.getElementById('flowCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.buildRoadTable();
    this.resetDefaults();
    this.bindEvents();
    this.resizeCanvas();
    this.refresh();
  },

  buildRoadTable() {
    const tbl = document.getElementById('roadTable');
    for (let i = 0; i < 4; i++) {
      const row = tbl.insertRow();
      row.insertCell().innerHTML = `<input type="checkbox" id="cb${i}" data-idx="${i}" checked>`;
      row.insertCell().innerHTML = `<span class="id-cell">${i+1}</span>`;
      row.insertCell().innerHTML = `<input type="text" id="tbName${i}" value="">`;
      row.insertCell().innerHTML = `<input type="number" id="tbDir${i}" value="">`;
      row.insertCell().innerHTML = `<input type="number" id="tbTurn${i}" value="">`;
      row.insertCell().innerHTML = `<input type="number" id="tbLeft${i}" value="">`;
      row.insertCell().innerHTML = `<input type="number" id="tbStraight${i}" value="">`;
      row.insertCell().innerHTML = `<input type="number" id="tbRight${i}" value="">`;
    }
  },

  resetDefaults() {
    const defs = [
      {name:'东路', dir:0, turn:100, left:300, straight:1000, right:300},
      {name:'北路', dir:90, turn:100, left:300, straight:1000, right:300},
      {name:'西路', dir:180, turn:100, left:300, straight:1000, right:300},
      {name:'南路', dir:270, turn:100, left:300, straight:1000, right:300}
    ];
    defs.forEach((d, i) => {
      this.setVal(`tbName${i}`, d.name);
      this.setVal(`tbDir${i}`, d.dir);
      this.setVal(`tbTurn${i}`, d.turn);
      this.setVal(`tbLeft${i}`, d.left);
      this.setVal(`tbStraight${i}`, d.straight);
      this.setVal(`tbRight${i}`, d.right);
      const cb = document.getElementById(`cb${i}`);
      if (cb) cb.checked = true;
      this.setReadonly(i, false);
    });
    DisplaySettings.zoomRatio = 1;
    DisplaySettings.moveX = 0;
    DisplaySettings.moveY = 0;
  },

  setVal(id, val) { const el = document.getElementById(id); if (el) el.value = val; },
  val(id) { const el = document.getElementById(id); return el ? el.value : ''; },

  setReadonly(idx, readonly) {
    const tags = ['tbName','tbDir','tbTurn','tbLeft','tbStraight','tbRight'];
    tags.forEach(t => {
      const el = document.getElementById(t + idx);
      if (el) {
        el.readOnly = readonly;
        if (readonly) el.classList.add('readonly');
        else el.classList.remove('readonly');
      }
    });
  },

  // 获取方向名称
  getRoadDirName(dir) {
    if (dir < 22.5 || dir > 337.5) return '东';
    if (dir < 67.5) return '东北';
    if (dir < 112.5) return '北';
    if (dir < 157.5) return '西北';
    if (dir < 202.5) return '西';
    if (dir < 247.5) return '西南';
    if (dir < 292.5) return '南';
    return '东南';
  },

  // 从UI读取roadList
  getRoadList() {
    const rl = [];
    const roadFlags = [0,1,2,3].map(i => {
      const cb = document.getElementById(`cb${i}`);
      return !(cb && cb.checked);
    });
    const names = [0,1,2,3].map(i => this.val(`tbName${i}`));
    const dirs = [0,1,2,3].map(i => parseInt(this.val(`tbDir${i}`)) || 0);
    const flows = [];
    flows.push(new FlowInfo(parseInt(this.val('tbTurn0'))||0, '0','0',0));
    flows.push(new FlowInfo(parseInt(this.val('tbLeft0'))||0, '0','3',1));
    flows.push(new FlowInfo(parseInt(this.val('tbStraight0'))||0, '0','2',2));
    flows.push(new FlowInfo(parseInt(this.val('tbRight0'))||0, '0','1',3));
    flows.push(new FlowInfo(parseInt(this.val('tbTurn1'))||0, '1','1',0));
    flows.push(new FlowInfo(parseInt(this.val('tbLeft1'))||0, '1','0',1));
    flows.push(new FlowInfo(parseInt(this.val('tbStraight1'))||0, '1','3',2));
    flows.push(new FlowInfo(parseInt(this.val('tbRight1'))||0, '1','2',3));
    flows.push(new FlowInfo(parseInt(this.val('tbTurn2'))||0, '2','2',0));
    flows.push(new FlowInfo(parseInt(this.val('tbLeft2'))||0, '2','1',1));
    flows.push(new FlowInfo(parseInt(this.val('tbStraight2'))||0, '2','0',2));
    flows.push(new FlowInfo(parseInt(this.val('tbRight2'))||0, '2','3',3));
    flows.push(new FlowInfo(parseInt(this.val('tbTurn3'))||0, '3','3',0));
    flows.push(new FlowInfo(parseInt(this.val('tbLeft3'))||0, '3','2',1));
    flows.push(new FlowInfo(parseInt(this.val('tbStraight3'))||0, '3','1',2));
    flows.push(new FlowInfo(parseInt(this.val('tbRight3'))||0, '3','0',3));

    let exceptID = 10;
    for (let i = 0; i < 4; i++) {
      if (!roadFlags[i]) {
        rl.push(new RoadInfo(i.toString(), names[i], dirs[i]));
      } else {
        exceptID = i;
      }
    }
    for (const ri of rl) {
      ri.flowsList = [new Flows()];
      for (const fi of flows) {
        if (fi.startId === ri.roadId && fi.endId !== exceptID.toString()) {
          ri.flowsList[0].flowList.push(new FlowInfo(fi.flowValue, fi.startId, fi.endId, fi.turnShow));
        }
      }
    }
    return rl;
  },

  // 验证
  validate(roadList) {
    // 检查负值和空值
    for (let i = 0; i < 4; i++) {
      const cb = document.getElementById(`cb${i}`);
      if (!cb || !cb.checked) continue;
      const tags = ['tbDir','tbTurn','tbLeft','tbStraight','tbRight'];
      for (const t of tags) {
        const v = parseInt(this.val(t + i));
        if (isNaN(v) || v < 0) return {ok:false, msg:'输入为空或有负值！请检查并重新输入！'};
      }
      if (!this.val('tbName' + i)) return {ok:false, msg:'路名不能为空！'};
    }
    if (roadList.length < 3) return {ok:false, msg:'仅支持三叉口和四叉口！'};

    // 角度验证
    const activeDirs = roadList.map(r => r.roadDir).sort((a,b) => a - b);
    if (activeDirs.length === 4) {
      for (let i = 1; i < 4; i++) {
        if (activeDirs[i] - activeDirs[i-1] <= 30) return {ok:false, msg:'角度需从小到大排列，相邻角差必须大于30度！'};
      }
      if (activeDirs[3] - activeDirs[0] >= 330) return {ok:false, msg:'角度需从小到大排列，最大最小角差应小于330度！'};
    } else if (activeDirs.length === 3) {
      // 三叉口角度验证
      for (let i = 1; i < 3; i++) {
        if (activeDirs[i] - activeDirs[i-1] <= 30) return {ok:false, msg:'角度需从小到大排列，相邻角差必须大于30度！'};
      }
      if (activeDirs[2] - activeDirs[0] >= 330) return {ok:false, msg:'最大最小角差应小于330度！'};
    }
    return {ok:true};
  },

  refresh() {
    const rl = this.getRoadList();
    const valid = this.validate(rl);
    if (!valid.ok) {
      alert(valid.msg);
      return;
    }
    this.roadList = rl;
    this.draw();
  },

  draw() {
    if (this.roadList.length === 0) return;
    const ctx = this.ctx;
    const size = this.canvasSize;

    const zr = DisplaySettings.zoomRatio;
    const mx = DisplaySettings.moveX;
    const my = DisplaySettings.moveY;

    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = DisplaySettings.backgroundColor;
    ctx.fillRect(0, 0, size, size);

    ctx.save();
    // 应用缩放和平移变换 (等价于WPF的ScaleTransform + TranslateTransform)
    // 先缩放(以中心为原点), 再平移
    ctx.translate(mx + size/2, my + size/2);
    ctx.scale(zr, zr);
    ctx.translate(-size/2, -size/2);

    Drawer.renderAll(ctx, size, size, this.roadList);
    ctx.restore();
  },

  resizeCanvas() {
    const wrap = document.getElementById('canvasWrap');
    const w = wrap.clientWidth - 30;
    const h = wrap.clientHeight - 30;
    let size = Math.min(w, h, 800);
    if (size < 200) size = 500; // 最小尺寸兜底
    this.canvasSize = size;
    this.canvas.width = size;
    this.canvas.height = size;
    this.canvas.style.width = size + 'px';
    this.canvas.style.height = size + 'px';
    if (this.roadList.length > 0) this.draw();
  },

  bindEvents() {
    // 文件菜单
    const btnFile = document.getElementById('btnFile');
    const fileMenu = document.getElementById('fileMenu');
    btnFile.addEventListener('click', e => {
      e.stopPropagation();
      fileMenu.classList.toggle('show');
    });
    document.addEventListener('click', () => fileMenu.classList.remove('show'));

    // 打开
    document.getElementById('miOpen').addEventListener('click', () => {
      fileMenu.classList.remove('show');
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput').addEventListener('change', e => {
      if (e.target.files.length > 0) {
        this.loadFlwFile(e.target.files[0]);
      }
    });

    // Excel导入
    document.getElementById('btnExcel').addEventListener('click', () => {
      document.getElementById('excelInput').click();
    });
    document.getElementById('excelInput').addEventListener('change', e => {
      if (e.target.files.length > 0) {
        this.importExcel(e.target.files[0]);
        e.target.value = ''; // 重置以允许重复导入同一文件
      }
    });

    // 下载Excel模板
    document.getElementById('btnTpl').addEventListener('click', () => {
      this.downloadTemplate();
    });

    // 保存
    document.getElementById('miSave').addEventListener('click', () => {
      fileMenu.classList.remove('show');
      this.saveFlwFile();
    });

    // 导出PNG
    document.getElementById('miExport').addEventListener('click', () => {
      fileMenu.classList.remove('show');
      this.exportPNG();
    });

    // 图形设置
    const overlay = document.getElementById('overlay');
    const graphPanel = document.getElementById('graphPanel');
    document.getElementById('btnGraph').addEventListener('click', () => {
      this.populateGraphSettings();
      overlay.classList.add('show');
      graphPanel.classList.add('show');
    });
    overlay.addEventListener('click', () => {
      overlay.classList.remove('show');
      graphPanel.classList.remove('show');
      document.getElementById('infoPanel').classList.remove('show');
    });
    document.getElementById('gsApply').addEventListener('click', () => {
      this.applyGraphSettings();
      overlay.classList.remove('show');
      graphPanel.classList.remove('show');
    });
    document.getElementById('gsCancel').addEventListener('click', () => {
      overlay.classList.remove('show');
      graphPanel.classList.remove('show');
    });

    // 关于
    document.getElementById('btnInfo').addEventListener('click', () => {
      overlay.classList.add('show');
      document.getElementById('infoPanel').classList.add('show');
    });
    document.getElementById('infoClose').addEventListener('click', () => {
      overlay.classList.remove('show');
      document.getElementById('infoPanel').classList.remove('show');
    });

    // 按钮
    document.getElementById('btnReset').addEventListener('click', () => {
      this.resetDefaults();
      this.refresh();
    });
    document.getElementById('btnRefresh').addEventListener('click', () => this.refresh());

    // Checkbox
    for (let i = 0; i < 4; i++) {
      const cb = document.getElementById(`cb${i}`);
      if (cb) cb.addEventListener('change', () => this.setReadonly(i, !cb.checked));
    }

    // 键盘回车刷新
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') {
        this.refresh();
      }
    });

    // 画布鼠标交互
    let dragging = false, lastX = 0, lastY = 0;
    this.canvas.addEventListener('mousedown', e => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      this.canvas.style.cursor = 'grabbing';
    });
    window.addEventListener('mouseup', () => {
      dragging = false;
      this.canvas.style.cursor = 'default';
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      DisplaySettings.moveX += dx;
      DisplaySettings.moveY += dy;
      this.draw();
    });
    this.canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const dz = e.deltaY > 0 ? -0.1 : 0.1;
      DisplaySettings.zoomRatio = Math.max(0.2, Math.min(5, DisplaySettings.zoomRatio + dz));
      this.draw();
    });

    // 窗口大小变化
    window.addEventListener('resize', () => this.resizeCanvas());
  },

  populateGraphSettings() {
    document.getElementById('gsFlowRatio').value = DisplaySettings.flowRatio;
    document.getElementById('gsFontFamily').value = DisplaySettings.fontfamily;
    const fsSelect = document.getElementById('gsFontSize');
    fsSelect.innerHTML = '';
    for (let i = 6; i <= 40; i += 2) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      if (i === DisplaySettings.fontsize) opt.selected = true;
      fsSelect.appendChild(opt);
    }
    document.getElementById('gsFontColor').value = DisplaySettings.fontcolor;
    document.getElementById('gsFlag').value = DisplaySettings.flag ? '1' : '0';
    document.getElementById('gsScale').value = DisplaySettings.scale * 100;
    document.getElementById('gsRoadColor0').value = DisplaySettings.roadColors[0];
    document.getElementById('gsRoadColor1').value = DisplaySettings.roadColors[1];
    document.getElementById('gsRoadColor2').value = DisplaySettings.roadColors[2];
    document.getElementById('gsRoadColor3').value = DisplaySettings.roadColors[3];
    document.getElementById('gsBgColor').value = DisplaySettings.backgroundColor;
  },

  applyGraphSettings() {
    DisplaySettings.flowRatio = parseFloat(document.getElementById('gsFlowRatio').value);
    DisplaySettings.fontfamily = document.getElementById('gsFontFamily').value;
    DisplaySettings.fontsize = parseInt(document.getElementById('gsFontSize').value);
    DisplaySettings.fontcolor = document.getElementById('gsFontColor').value;
    DisplaySettings.flag = document.getElementById('gsFlag').value === '1';
    DisplaySettings.scale = parseInt(document.getElementById('gsScale').value) / 100;
    DisplaySettings.roadColors = [
      document.getElementById('gsRoadColor0').value,
      document.getElementById('gsRoadColor1').value,
      document.getElementById('gsRoadColor2').value,
      document.getElementById('gsRoadColor3').value
    ];
    DisplaySettings.backgroundColor = document.getElementById('gsBgColor').value;
    this.draw();
  },

  // .flw文件解析 (XML)
  loadFlwFile(file) {
    // 将可能的#AARRGGBB颜色转为#RRGGBB
    const toHex6 = (c) => c && c.length === 9 && c.startsWith('#') ? '#' + c.substring(3) : c;
    const reader = new FileReader();
    reader.onload = e => {
      const xmlStr = e.target.result;
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlStr, 'text/xml');
      const roadsEl = xmlDoc.documentElement;
      if (!roadsEl || roadsEl.tagName !== 'Roads') {
        alert('无效的.flw文件格式');
        return;
      }

      // 读取设置
      const getEl = (tag) => roadsEl.getElementsByTagName(tag)[0];
      const getVal = (tag) => getEl(tag) ? getEl(tag).textContent : '';
      if (getEl('fontsize')) DisplaySettings.fontsize = parseFloat(getVal('fontsize'));
      if (getEl('fontfamily')) DisplaySettings.fontfamily = getVal('fontfamily');
      if (getEl('fontcolor')) DisplaySettings.fontcolor = toHex6(getVal('fontcolor'));
      if (getEl('flag')) DisplaySettings.flag = getVal('flag').toLowerCase() === 'true';
      if (getEl('scale')) DisplaySettings.scale = parseFloat(getVal('scale'));
      if (getEl('roadColor1')) DisplaySettings.roadColors[0] = toHex6(getVal('roadColor1'));
      if (getEl('roadColor2')) DisplaySettings.roadColors[1] = toHex6(getVal('roadColor2'));
      if (getEl('roadColor3')) DisplaySettings.roadColors[2] = toHex6(getVal('roadColor3'));
      if (getEl('roadColor4')) DisplaySettings.roadColors[3] = toHex6(getVal('roadColor4'));
      if (getEl('backgroundColor')) DisplaySettings.backgroundColor = toHex6(getVal('backgroundColor'));

      // 读取路段
      const roadEls = roadsEl.getElementsByTagName('road');
      const loadedRoads = [];
      for (let ri = 0; ri < roadEls.length; ri++) {
        const roadEl = roadEls[ri];
        const rid = roadEl.getElementsByTagName('RoadId')[0].textContent;
        const rname = roadEl.getElementsByTagName('RoadName')[0].textContent;
        const rdir = parseInt(roadEl.getElementsByTagName('RoadDir')[0].textContent);
        const road = new RoadInfo(rid, rname, rdir);
        const flowsEl = roadEl.getElementsByTagName('Flows')[0];
        const flowEls = flowsEl.getElementsByTagName('Flow');
        road.flowsList = [new Flows()];
        for (let fi = 0; fi < flowEls.length; fi++) {
          const f = flowEls[fi];
          road.flowsList[0].flowList.push(new FlowInfo(
            parseInt(f.getElementsByTagName('FlowValue')[0].textContent),
            f.getElementsByTagName('StartId')[0].textContent,
            f.getElementsByTagName('EndId')[0].textContent,
            parseInt(f.getElementsByTagName('TurnShow')[0].textContent)
          ));
        }
        loadedRoads.push(road);
      }

      // 更新UI
      this.roadList = loadedRoads;
      for (let i = 0; i < Math.min(4, loadedRoads.length); i++) {
        const r = loadedRoads[i];
        this.setVal(`tbName${i}`, r.roadName);
        this.setVal(`tbDir${i}`, r.roadDir);
        this.setReadonly(i, false);
        const cb = document.getElementById(`cb${i}`);
        if (cb) cb.checked = true;

        // 填充流量
        const fList = r.flowsList[0].flowList;
        for (const f of fList) {
          const tags = {0:'tbTurn', 1:'tbLeft', 2:'tbStraight', 3:'tbRight'};
          const tid = tags[f.turnShow] + i;
          this.setVal(tid, f.flowValue);
        }
      }
      // 如果只有3条路
      if (loadedRoads.length === 3) {
        const cb3 = document.getElementById('cb3');
        if (cb3) { cb3.checked = false; this.setReadonly(3, true); }
      }

      DisplaySettings.zoomRatio = 1;
      DisplaySettings.moveX = 0;
      DisplaySettings.moveY = 0;
      this.draw();
    };
    reader.readAsText(file);
  },

  // 保存为.flw (XML)
  saveFlwFile() {
    this.roadList = this.getRoadList();
    let xml = '<?xml version="1.0" encoding="utf-8"?>\n<Roads>\n';
    xml += `  <fontsize>${DisplaySettings.fontsize}</fontsize>\n`;
    xml += `  <fontfamily>${DisplaySettings.fontfamily}</fontfamily>\n`;
    xml += `  <fontcolor>${DisplaySettings.fontcolor}</fontcolor>\n`;
    xml += `  <flag>${DisplaySettings.flag}</flag>\n`;
    xml += `  <scale>${DisplaySettings.scale}</scale>\n`;
    xml += `  <roadColor1>${DisplaySettings.roadColors[0]}</roadColor1>\n`;
    xml += `  <roadColor2>${DisplaySettings.roadColors[1]}</roadColor2>\n`;
    xml += `  <roadColor3>${DisplaySettings.roadColors[2]}</roadColor3>\n`;
    xml += `  <roadColor4>${DisplaySettings.roadColors[3]}</roadColor4>\n`;
    xml += `  <backgroundColor>${DisplaySettings.backgroundColor}</backgroundColor>\n`;

    for (const r of this.roadList) {
      xml += '  <road>\n';
      xml += `    <RoadId>${r.roadId}</RoadId>\n`;
      xml += `    <RoadName>${r.roadName}</RoadName>\n`;
      xml += `    <RoadDir>${r.roadDir}</RoadDir>\n`;
      xml += '    <Flows>\n';
      for (const f of r.flowsList[0].flowList) {
        xml += '      <Flow>\n';
        xml += `        <FlowValue>${f.flowValue}</FlowValue>\n`;
        xml += `        <StartId>${f.startId}</StartId>\n`;
        xml += `        <EndId>${f.endId}</EndId>\n`;
        xml += `        <TurnShow>${f.turnShow}</TurnShow>\n`;
        xml += '      </Flow>\n';
      }
      xml += '    </Flows>\n';
      xml += '  </road>\n';
    }
    xml += '</Roads>';

    const blob = new Blob([xml], {type:'application/xml'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'flowmap.flw';
    a.click();
    URL.revokeObjectURL(url);
  },

  // 导出PNG
  exportPNG() {
    const link = document.createElement('a');
    link.download = 'flowmap.png';
    link.href = this.canvas.toDataURL('image/png');
    link.click();
  },

  // ---------- Excel 模板下载 ----------
  downloadTemplate() {
    // 与用户"模版.xlsx"格式完全一致：序号 1-4，第一列表头留空
    const rows = [
      [null, '路名', '角度', '掉头', '左转', '直行', '右转'],
      [1, '东进口', 0, 72, 123, 1254, 235],
      [2, '北进口', 90, 60, 213, 2365, 302],
      [3, '西进口', 180, 80, 145, 1891, 123],
      [4, '南进口', 270, 70, 198, 3100, 411]
    ];
    const ws = XLSX.utils.aoa_to_sheet(rows);

    ws['!cols'] = [
      {wch: 6}, {wch: 12}, {wch: 8},
      {wch: 8}, {wch: 8}, {wch: 8}, {wch: 8}
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

    // 手动导出确保文件名正确（避免XLSX.writeFile被沙箱拦截改UUID）
    const buf = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
    const blob = new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'FlowMap_Excel.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },

  // ---------- Excel 导入 ----------
  importExcel(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {header: 1});

        if (data.length < 5) {
          alert('模板至少需要5行（1行表头 + 4行数据）');
          return;
        }

        // 逐行解析（跳过第1行表头），模板序号1-4转内部ID 0-3
        const roads = [];
        for (let i = 1; i <= 4; i++) {
          const row = data[i];
          if (!row || row.length < 7) {
            alert(`第${i + 1}行数据不完整，需要7列`);
            return;
          }
          // 序号减1得0-3内部ID
          const roadId = String(parseInt(row[0]) - 1);
          const roadName = String(row[1] || '').trim();
          const roadDir = parseFloat(row[2]) || 0;
          const road = new RoadInfo(roadId, roadName, roadDir);
          road.flowsList = [new Flows()];

          // 4种转向：掉头→左→直→右（列3~6）
          const turnValues = [
            {turn: 0, val: parseInt(row[3]) || 0},
            {turn: 1, val: parseInt(row[4]) || 0},
            {turn: 2, val: parseInt(row[5]) || 0},
            {turn: 3, val: parseInt(row[6]) || 0}
          ];

          for (const tv of turnValues) {
            if (tv.val === 0) continue;
            // endId = (startId - turnShow + 4) % 4
            const endId = String((parseInt(roadId) - tv.turn + 4) % 4);
            road.flowsList[0].flowList.push(new FlowInfo(tv.val, roadId, endId, tv.turn));
          }

          roads.push(road);
        }

        if (roads.length < 4) {
          alert('需要完整的4条进口道数据');
          return;
        }

        // 数据有效 → 更新全局状态
        this.roadList = roads;

        // 填充右侧表单
        for (let i = 0; i < 4; i++) {
          const r = roads[i];
          this.setVal(`tbName${i}`, r.roadName);
          this.setVal(`tbDir${i}`, r.roadDir);
          this.setReadonly(i, false);
          const cb = document.getElementById(`cb${i}`);
          if (cb) cb.checked = true;

          // 清空旧值
          const tags = ['tbTurn','tbLeft','tbStraight','tbRight'];
          for (const t of tags) this.setVal(t + i, '');

          // 填入新值
          const fList = r.flowsList[0].flowList;
          const tagMap = {0:'tbTurn', 1:'tbLeft', 2:'tbStraight', 3:'tbRight'};
          for (const f of fList) {
            const tid = tagMap[f.turnShow] + i;
            this.setVal(tid, f.flowValue);
          }
        }

        DisplaySettings.zoomRatio = 1;
        DisplaySettings.moveX = 0;
        DisplaySettings.moveY = 0;
        this.draw();
        // 二次刷新确保所有连线渲染完整
        requestAnimationFrame(() => this.draw());
      } catch (err) {
        alert('Excel解析失败：' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }
};
